<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | Coffee App</title>
    <link rel="stylesheet" href="./src/scss/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <a href="index.html" class="logo">
          <img src="./assets/icons/logo.png" alt="CoffeeHouse Logo" />
        </a>

        <nav class="nav">
          <ul class="nav__list">
            <li><a href="#favourites">Favourite coffee</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#mobile-app">Mobile app</a></li>
            <li><a href="#contacts">Contact us</a></li>
            <li class="menu-link-mobile"><a href="menu.html">Menu</a></li>
          </ul>
        </nav>

        <a href="menu.html" class="header__menu active">
          <span>Menu</span>
          <img src="./assets/icons/coffee-cup.png" alt="Coffee Cup" />
        </a>

        <button class="menu-btn" id="burger-btn" aria-label="Open menu">
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <form id="register-form" class="register-form">
  <div class="form-group">
    <label for="login">Login</label>
    <input type="text" id="login" />
    <div class="validation-msg"></div>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" />
    <div class="validation-msg"></div>
  </div>

  <div class="form-group">
    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" />
    <div class="validation-msg"></div>
  </div>

  <div class="form-group">
    <label for="city">City</label>
    <select id="city">
      <option value="">Select city</option>
      <option value="City1">City1</option>
      <option value="City2">City2</option>
      <option value="City3">City3</option>
    </select>
    <div class="validation-msg"></div>
  </div>

  <div class="form-group">
    <label for="street">Street</label>
    <select id="street">
      <option value="">Select street</option>
    </select>
    <div class="validation-msg"></div>
  </div>

  <div class="form-group">
    <label for="house-number">House Number</label>
    <input type="number" id="house-number" min="1" />
    <div class="validation-msg"></div>
  </div>

  <div class="form-group">
    <label>Payment Method</label>
    <label><input type="radio" name="payment-method" value="Cash" /> Cash</label>
    <label><input type="radio" name="payment-method" value="Card" /> Card</label>
    <div class="validation-msg"></div>
  </div>

  <div id="form-error" class="form-error"></div>

  <button id="register-btn" type="submit" disabled>Register</button>
</form>

    </main>

    <div id="top-notification-container"></div>

    <footer id="contacts" class="footer container">
      <div class="footer__container">
        <div class="footer-content">
          <h2>
            Sip, Savor, Smile.
            <span class="highlight">It’s coffee time!</span>
          </h2>
          <div class="footer-icons">
            <a
              href="https://twitter.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              aria-label="Twitter"
            >
              <img src="assets/icons/icon-twitter.svg" alt="Twitter" />
            </a>

            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              aria-label="Instagram"
            >
              <img src="assets/icons/instagram.svg" alt="Instagram" />
            </a>

            <a
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              aria-label="Facebook"
            >
              <img src="assets/icons/facebook.svg" alt="Facebook" />
            </a>
          </div>
        </div>
        <div class="contacts">
          <h3>Contact us</h3>
          <ul>
            <li>
              <a
                href="https://www.google.com/maps"
                target="_blank"
                rel="noopener noreferrer"
                ><img src="./assets/icons/location.svg" alt="location" />
                8558 Green Rd., LA
              </a>
            </li>
            <li>
              <a href="tel:+16035550123"
                ><img src="./assets/icons/phone.svg" alt="phone" /> +1 (603)
                555-0123</a
              >
            </li>
            <li>
              <img src="./assets/icons/clock.svg" alt="clock" />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/ts/register.ts"></script>
  </body>
</html>
