<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | Coffee App</title>
    <link rel="stylesheet" href="./src/scss/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <a href="index.html" class="logo">
          <img src="./assets/icons/logo.png" alt="CoffeeHouse Logo" />
        </a>

        <nav class="nav">
          <ul class="nav__list">
            <li><a href="#favourites">Favourite coffee</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#mobile-app">Mobile app</a></li>
            <li><a href="#contacts">Contact us</a></li>
            <li class="menu-link-mobile"><a href="menu.html">Menu</a></li>
          </ul>
        </nav>

        <div class="cart-menu">
          <a
            href="cart.html"
            class="header__cart"
            id="cart-icon"
            aria-label="Cart"
          >
            <img src="./assets/icons/cart.svg" alt="Cart" />
            <span class="cart-count">0</span>
          </a>

          <a href="menu.html" class="header__menu active">
            <span>Menu</span>
            <img src="./assets/icons/coffee-cup.png" alt="Coffee Cup" />
          </a>
        </div>

        <button class="menu-btn" id="burger-btn" aria-label="Open menu">
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="container cart">
        <h1 class="page-title">Cart</h1>
        <div class="cart-root"></div>
      </div>
    </main>

    <div id="top-notification-container"></div>

    <footer id="contacts" class="footer container">
      <div class="footer__container">
        <div class="footer-content">
          <h2>
            Sip, Savor, Smile.
            <span class="highlight">It’s coffee time!</span>
          </h2>
          <div class="footer-icons">
            <a
              href="https://twitter.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              aria-label="Twitter"
            >
              <img src="assets/icons/icon-twitter.svg" alt="Twitter" />
            </a>

            <a
              href="https://www.instagram.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              aria-label="Instagram"
            >
              <img src="assets/icons/instagram.svg" alt="Instagram" />
            </a>

            <a
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
              class="footer__link"
              aria-label="Facebook"
            >
              <img src="assets/icons/facebook.svg" alt="Facebook" />
            </a>
          </div>
        </div>
        <div class="contacts">
          <h3>Contact us</h3>
          <ul>
            <li>
              <a
                href="https://www.google.com/maps"
                target="_blank"
                rel="noopener noreferrer"
                ><img src="./assets/icons/location.svg" alt="location" />
                8558 Green Rd., LA
              </a>
            </li>
            <li>
              <a href="tel:+16035550123"
                ><img src="./assets/icons/phone.svg" alt="phone" /> +1 (603)
                555-0123</a
              >
            </li>
            <li>
              <img src="./assets/icons/clock.svg" alt="clock" />
              Mon-Sat: 9:00 AM – 23:00 PM
            </li>
          </ul>
        </div>
      </div>
    </footer>

    <script type="module" src="./src/ts/cart.ts"></script>
  </body>
</html>
